---
name: publish

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm >= 11.5 required for OIDC trusted publishing
      - name: Update npm
        run: npm install -g npm@latest

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn tsc

      - name: Build package
        run: yarn workspace backstage-plugin-techdocs-addon-dbml build

      - name: Stage publish to npm
        run: npm stage publish --provenance --access public
        working-directory: plugins/techdocs-addon-dbml
