# Public docs site (Zensical). TechDocs builds the same docs/ tree
# through the root mkdocs.yml instead — Zensical cannot run the
# techdocs-core mkdocs plugin, hence two configs over one tree.
[project]
site_url = "https://panda-coop.github.io/backstage-plugin-techdocs-addon-dbml/"
site_name = "backstage-plugin-techdocs-addon-dbml"
site_description = "Backstage TechDocs addon rendering interactive DBML diagrams"
repo_url = "https://github.com/panda-coop/backstage-plugin-techdocs-addon-dbml"
repo_name = "panda-coop/backstage-plugin-techdocs-addon-dbml"
copyright = "Copyright &copy; 2026 PANDA Coop"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Usage" = "usage.md" },
  { "Authoring" = "authoring.md" },
  { "Features" = "features.md" },
  { "Reference" = "reference.md" },
  { "Examples" = [
    { "Overview" = "example/index.md" },
    { "Simple schema" = "example/samples/simple.md" },
    { "Large schema" = "example/samples/large.md" },
    { "Invalid DBML" = "example/samples/invalid.md" },
  ] },
]

[project.theme]
variant = "classic"
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
